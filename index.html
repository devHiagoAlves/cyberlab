
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Academy - Simulador</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Para converter JSX no navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #030712; color: #d1d5db; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SERVIÇO DE IA (GEMINI API) ---
        const apiKey = ""; 

        const callGeminiAPI = async (promptText) => {
            if (!apiKey) return "Modo offline simulado. A chave da API não está configurada no código.";
            
            try {
                const payload = {
                    contents: [{ parts: [{ text: promptText }] }],
                    systemInstruction: { 
                        parts: [{ 
                            text: "Você é o 'Nexus', um assistente avançado de IA especializado em cibersegurança (Pentest e SOC) dentro de uma plataforma gamificada. Dê respostas concisas, técnicas e didáticas. Explique vulnerabilidades do OWASP Top 10. Fale em português do Brasil." 
                        }] 
                    }
                };
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Conexão com o mainframe de IA falhou.";
            } catch (e) {
                console.error("Erro na API Gemini:", e);
                return "Erro ao contatar o Nexus AI. Verifique o console.";
            }
        };

        const MISSIONS = [
            { id: 1, title: "Injeção de SQL (SQLi)", type: "Offensive", diff: "Iniciante", owasp: "A03:2021", points: 100, desc: "Explore o login para extrair dados. (Dica: use 'sqlmap -u target.local/login')" },
            { id: 2, title: "Broken Authentication", type: "Offensive", diff: "Iniciante", owasp: "A07:2021", points: 100, desc: "Ataque de força bruta no SSH. (Dica: use 'hydra ssh://target.local')" },
            { id: 3, title: "Mitigação de DDoS e WAF", type: "Defensive", diff: "Intermediário", owasp: "A05:2021", points: 150, desc: "Aplique correções no Firewall. (Dica: use 'patch waf')" },
            { id: 4, title: "Cross-Site Scripting (XSS)", type: "Offensive", diff: "Intermediário", owasp: "A03:2021", points: 150, desc: "Vaze cookies do admin. (Dica: use 'exploit xss')" }
        ];

        function CyberSecApp() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [playerInfo, setPlayerInfo] = useState({ score: 0, level: 1, rank: 'Script Kiddie' });
            
            // Estado Global das Missões
            const [activeMission, setActiveMission] = useState(null);
            const [completedMissions, setCompletedMissions] = useState([]);
            
            useEffect(() => {
                const newLevel = Math.floor(playerInfo.score / 200) + 1;
                let newRank = 'Script Kiddie';
                if (newLevel >= 3) newRank = 'Junior Pentester';
                if (newLevel >= 5) newRank = 'SOC Analyst L1';
                if (newLevel >= 10) newRank = 'Cyber Expert';
                
                if (newLevel !== playerInfo.level || newRank !== playerInfo.rank) {
                    setPlayerInfo(prev => ({ ...prev, level: newLevel, rank: newRank }));
                }
            }, [playerInfo.score]);

            const addScore = (points) => {
                setPlayerInfo(prev => ({ ...prev, score: prev.score + points }));
            };

            const startMission = (mission) => {
                setActiveMission(mission);
                setActiveTab('terminal');
            };

            const finishMission = (missionId) => {
                if (!completedMissions.includes(missionId)) {
                    const mission = MISSIONS.find(m => m.id === missionId);
                    setCompletedMissions(prev => [...prev, missionId]);
                    addScore(mission.points);
                    setActiveMission(null);
                }
            };

            return (
                <div className="flex flex-col md:flex-row h-screen bg-gray-950 text-gray-300 font-mono overflow-hidden">
                    {/* SIDEBAR */}
                    <aside className="w-full md:w-64 bg-gray-900 border-b md:border-b-0 md:border-r border-green-900/30 flex flex-col shrink-0 z-20 relative">
                        <div className="p-4 border-b border-green-900/30 hidden md:block">
                            <h1 className="text-xl font-bold text-green-500 flex items-center gap-2">
                                <i className="fas fa-shield-alt w-5"></i> CyberSec UI
                            </h1>
                        </div>
                        
                        <nav className="flex md:flex-col overflow-x-auto no-scrollbar p-2 md:p-4 gap-2 flex-1 items-center md:items-stretch">
                            <NavButton icon="fa-columns" label="Dashboard" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                            <NavButton icon="fa-terminal" label="Terminal" active={activeTab === 'terminal'} onClick={() => setActiveTab('terminal')} badge={activeMission ? '!' : null} />
                            <NavButton icon="fa-chart-line" label="SOC Panel" active={activeTab === 'soc'} onClick={() => setActiveTab('soc')} />
                            <NavButton icon="fa-bullseye" label="Missões" active={activeTab === 'missions'} onClick={() => setActiveTab('missions')} />
                            <NavButton icon="fa-robot" label="Nexus AI" active={activeTab === 'ai'} onClick={() => setActiveTab('ai')} />
                        </nav>

                        <div className="p-4 bg-gray-900 border-t border-green-900/30 hidden md:block">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-green-900/50 flex items-center justify-center border border-green-500/50 text-green-400 font-bold">
                                    L{playerInfo.level}
                                </div>
                                <div>
                                    <p className="text-sm font-semibold text-gray-200">Operador Z3R0</p>
                                    <p className="text-xs text-green-400">{playerInfo.rank}</p>
                                    <p className="text-xs text-yellow-500 mt-1">{playerInfo.score} XP</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT - Usando display block/none para preservar o estado (variáveis não resetam ao trocar de aba) */}
                    <main className="flex-1 relative h-[calc(100vh-60px)] md:h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-gray-950 to-black overflow-hidden">
                        <div style={{ display: activeTab === 'dashboard' ? 'block' : 'none', height: '100%' }}>
                            <Dashboard playerInfo={playerInfo} completedCount={completedMissions.length} />
                        </div>
                        <div style={{ display: activeTab === 'terminal' ? 'block' : 'none', height: '100%' }}>
                            <TerminalInterface addScore={addScore} activeMission={activeMission} finishMission={finishMission} />
                        </div>
                        <div style={{ display: activeTab === 'soc' ? 'block' : 'none', height: '100%' }}>
                            <SOCPanel addScore={addScore} />
                        </div>
                        <div style={{ display: activeTab === 'missions' ? 'block' : 'none', height: '100%' }}>
                            <MissionsList startMission={startMission} completedMissions={completedMissions} activeMission={activeMission} />
                        </div>
                        <div style={{ display: activeTab === 'ai' ? 'block' : 'none', height: '100%' }}>
                            <AIAssistant />
                        </div>
                    </main>
                </div>
            );
        }

        // --- SUB-COMPONENTES ---

        function NavButton({ icon, label, active, onClick, badge }) {
            return (
                <button 
                    onClick={onClick}
                    className={`relative flex items-center gap-2 px-4 py-2 rounded-lg text-left transition-all duration-200 whitespace-nowrap shrink-0 md:w-full ${
                        active 
                            ? 'bg-green-500/10 text-green-400 border border-green-500/30' 
                            : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'
                    }`}
                >
                    <i className={`fas ${icon} w-5 text-center`}></i>
                    <span className="font-medium text-sm hidden md:inline">{label}</span>
                    <span className="font-medium text-xs md:hidden">{label}</span>
                    {badge && (
                        <span className="absolute top-1 right-2 w-2 h-2 bg-yellow-500 rounded-full animate-ping"></span>
                    )}
                </button>
            );
        }

        function Dashboard({ playerInfo, completedCount }) {
            return (
                <div className="p-4 md:p-8 overflow-y-auto h-full">
                    <header className="mb-6 md:mb-8">
                        <h2 className="text-xl md:text-2xl font-bold text-white">Quartel General</h2>
                        <p className="text-gray-400 text-xs md:text-sm mt-1">Visão geral do seu treinamento.</p>
                    </header>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mb-8">
                        <StatCard icon="fa-award" title="Nível Atual" value={playerInfo.level} subtitle={playerInfo.rank} color="text-yellow-400" />
                        <StatCard icon="fa-bolt" title="Experiência (XP)" value={playerInfo.score} subtitle="Pontos totais acumulados" color="text-green-400" />
                        <StatCard icon="fa-bullseye" title="Missões Concluídas" value={`${completedCount} / ${MISSIONS.length}`} subtitle="Progresso da campanha" color="text-red-400" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 md:p-6 relative overflow-hidden group">
                            <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                <i className="fas fa-terminal text-6xl text-green-500"></i>
                            </div>
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <i className="fas fa-info-circle text-sm"></i> Como Jogar
                            </h3>
                            <p className="text-sm text-gray-300 mb-2 z-10 relative">1. Vá até a aba <strong>Missões</strong> e clique em Iniciar em um desafio.</p>
                            <p className="text-sm text-gray-300 mb-2 z-10 relative">2. O sistema te levará ao <strong>Terminal</strong>. Siga as instruções do desafio digitando comandos.</p>
                            <p className="text-sm text-gray-300 mb-2 z-10 relative">3. Se quiser uma ação mais rápida, vá para a aba <strong>SOC Panel</strong> e analise o tráfego da rede para ganhar XP.</p>
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ icon, title, value, subtitle, color }) {
            return (
                <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 md:p-6 flex items-start gap-4">
                    <div className={`p-3 rounded-lg bg-gray-950 border border-gray-800 flex items-center justify-center w-12 h-12 ${color}`}>
                        <i className={`fas ${icon} text-xl`}></i>
                    </div>
                    <div>
                        <h4 className="text-gray-400 text-xs md:text-sm font-medium">{title}</h4>
                        <div className="text-xl md:text-2xl font-bold text-white mt-1">{value}</div>
                        <div className="text-xs text-gray-500 mt-1">{subtitle}</div>
                    </div>
                </div>
            );
        }

        // --- TERMINAL SIMULATOR ---
        function TerminalInterface({ addScore, activeMission, finishMission }) {
            const [history, setHistory] = useState([
                { type: 'system', content: 'Iniciando Kernel Hacking OS v1.0.4...' },
                { type: 'system', content: 'Conexão segura estabelecida.' },
                { type: 'info', content: 'Digite "help" para listar os comandos.' },
            ]);
            const [input, setInput] = useState('');
            const endRef = useRef(null);
            const lastMissionId = useRef(null);

            // Escuta se uma nova missão foi iniciada para dar as boas vindas no terminal
            useEffect(() => {
                if (activeMission && activeMission.id !== lastMissionId.current) {
                    setHistory(prev => [...prev, 
                        { type: 'warning', content: '----------------------------------------' },
                        { type: 'warning', content: `[ALERTA DE MISSÃO] ${activeMission.title} Iniciada!` },
                        { type: 'info', content: `[OBJETIVO] ${activeMission.desc}` },
                        { type: 'warning', content: '----------------------------------------' }
                    ]);
                    lastMissionId.current = activeMission.id;
                }
            }, [activeMission]);

            useEffect(() => {
                endRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [history]);

            const handleCommand = async (e) => {
                e.preventDefault();
                if (!input.trim()) return;

                const cmd = input.trim();
                const args = cmd.split(/\s+/);
                const baseCmd = args[0].toLowerCase();

                setHistory(prev => [...prev, { type: 'input', content: `$ ${cmd}` }]);
                setInput('');

                let response = [];
                let missionCompleted = false;

                switch(baseCmd) {
                    case 'help':
                        response = [
                            { type: 'info', content: 'Comandos simulados disponíveis:' },
                            { type: 'info', content: '  clear    - Limpa o terminal' },
                            { type: 'info', content: '  nmap     - Varredura de rede (ex: nmap target.local)' },
                            { type: 'info', content: '  sqlmap   - Ataque SQLi (ex: sqlmap -u target.local/login)' },
                            { type: 'info', content: '  hydra    - Força Bruta (ex: hydra ssh://target.local)' },
                            { type: 'info', content: '  exploit  - Scripts diversos (ex: exploit xss)' },
                            { type: 'info', content: '  patch    - Aplica correções defensivas (ex: patch waf)' },
                            { type: 'info', content: '  ask_ai   - Pede ajuda à IA (ex: ask_ai como mitigar XSS?)' },
                        ];
                        break;
                    case 'clear':
                        setHistory([]); return;
                        
                    case 'nmap':
                        response = [
                            { type: 'system', content: `Executando Nmap em target.local...` },
                            { type: 'info', content: 'Porta 80/tcp aberta (http - Apache)' },
                            { type: 'info', content: 'Porta 22/tcp aberta (ssh - OpenSSH)' },
                            { type: 'info', content: 'Porta 3306/tcp aberta (mysql)' },
                        ];
                        break;

                    case 'sqlmap':
                        if (args.includes('target.local/login')) {
                            response = [
                                { type: 'system', content: `Iniciando SQLMap no alvo...` },
                                { type: 'warning', content: 'Testando payload: \' OR 1=1 --' },
                                { type: 'success', content: 'Bypass de autenticação realizado com sucesso!' }
                            ];
                            if (activeMission && activeMission.id === 1) missionCompleted = true;
                        } else {
                            response = [{ type: 'error', content: 'Faltam argumentos. Tente: sqlmap -u target.local/login' }];
                        }
                        break;

                    case 'hydra':
                        if (cmd.includes('ssh://target.local')) {
                            response = [
                                { type: 'system', content: 'Iniciando ataque de dicionário no SSH...' },
                                { type: 'warning', content: 'Tentando senhas comuns...' },
                                { type: 'success', content: '[OK] Credenciais encontradas: admin / password123' }
                            ];
                            if (activeMission && activeMission.id === 2) missionCompleted = true;
                        } else {
                            response = [{ type: 'error', content: 'Alvo inválido. Tente: hydra ssh://target.local' }];
                        }
                        break;

                    case 'patch':
                        if (args[1] === 'waf') {
                            response = [
                                { type: 'system', content: 'Injetando regras de rate-limiting e assinaturas no WAF...' },
                                { type: 'success', content: 'Firewall configurado. Tráfego malicioso bloqueado!' }
                            ];
                            if (activeMission && activeMission.id === 3) missionCompleted = true;
                        } else {
                            response = [{ type: 'error', content: 'O que deseja corrigir? Ex: patch waf' }];
                        }
                        break;
                        
                    case 'exploit':
                        if (args[1] === 'xss') {
                            response = [
                                { type: 'system', content: 'Enviando script malicioso via campo de comentário...' },
                                { type: 'success', content: 'Cookie de Sessão do Admin roubado: session_id=abc123xyz' }
                            ];
                            if (activeMission && activeMission.id === 4) missionCompleted = true;
                        } else {
                            response = [{ type: 'error', content: 'Faltam parâmetros. Ex: exploit xss' }];
                        }
                        break;

                    case 'ask_ai':
                        const question = args.slice(1).join(' ');
                        if (!question) {
                            response = [{ type: 'error', content: 'Faça uma pergunta. Ex: ask_ai o que é XSS?' }];
                        } else {
                            setHistory(prev => [...prev, { type: 'system', content: 'Analisando consulta com IA...' }]);
                            const aiReply = await callGeminiAPI(question);
                            setHistory(prev => [...prev, { type: 'ai', content: `Nexus: ${aiReply}` }]);
                            return; 
                        }
                        break;

                    default:
                        response = [{ type: 'error', content: `Comando não reconhecido: ${baseCmd}. Digite 'help'.` }];
                }

                // Adiciona o output do comando atual
                setHistory(prev => [...prev, ...response]);
                
                // Se o comando completou a missão atual
                if (missionCompleted && activeMission) {
                    setTimeout(() => {
                        setHistory(prev => [...prev, 
                            { type: 'success', content: '=======================================' },
                            { type: 'success', content: `🎉 MISSÃO "${activeMission.title.toUpperCase()}" CONCLUÍDA! 🎉` },
                            { type: 'success', content: `+${activeMission.points} XP Adquiridos.` },
                            { type: 'success', content: '=======================================' }
                        ]);
                        finishMission(activeMission.id);
                    }, 500);
                }
            };

            return (
                <div className="h-full flex flex-col p-2 md:p-6 font-mono text-xs md:text-sm">
                    {activeMission && (
                        <div className="bg-yellow-500/10 border border-yellow-500/30 text-yellow-500 p-2 text-center text-xs font-bold rounded-t-xl shrink-0">
                            MISSÃO ATIVA: {activeMission.title}
                        </div>
                    )}
                    <div className={`flex-1 bg-black/80 border border-gray-800 p-3 overflow-y-auto shadow-2xl ${activeMission ? '' : 'rounded-t-xl'}`}>
                        {history.map((line, i) => (
                            <div key={i} className={`mb-1.5 break-words ${
                                line.type === 'input' ? 'text-gray-300' :
                                line.type === 'error' ? 'text-red-400' :
                                line.type === 'success' ? 'text-green-400 font-bold' :
                                line.type === 'warning' ? 'text-yellow-400' :
                                line.type === 'ai' ? 'text-purple-400 border-l-2 border-purple-500 pl-2 my-2' :
                                'text-blue-400'
                            }`}>
                                {line.content}
                            </div>
                        ))}
                        <div ref={endRef} />
                    </div>
                    <form onSubmit={handleCommand} className="bg-gray-950 border border-t-0 border-gray-800 rounded-b-xl flex items-center p-2 shrink-0">
                        <span className="text-green-500 ml-1 md:ml-2 mr-2 font-bold whitespace-nowrap">root@cyber:~$</span>
                        <input 
                            type="text" 
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            className="flex-1 bg-transparent text-gray-200 outline-none w-full"
                            autoComplete="off"
                            spellCheck="false"
                        />
                    </form>
                </div>
            );
        }

        // --- SOC DASHBOARD ---
        function SOCPanel({ addScore }) {
            const [alerts, setAlerts] = useState([
                { id: 1, type: 'CRITICAL', source: '192.168.1.105', desc: 'Múltiplas requisições SSH detectadas', status: 'Active', time: new Date().toLocaleTimeString().slice(0,5) }
            ]);

            useEffect(() => {
                const interval = setInterval(() => {
                    const types = ['HIGH', 'MEDIUM', 'CRITICAL'];
                    const attacks = ['Tentativa de injeção SQL no /api', 'Scanner de vulnerabilidade (Nikto)', 'Tráfego Anômalo na porta 443', 'Payload XSS detectado no Header'];
                    
                    const newAlert = {
                        id: Date.now(),
                        type: types[Math.floor(Math.random() * types.length)],
                        source: `10.0.0.${Math.floor(Math.random() * 255)}`,
                        desc: attacks[Math.floor(Math.random() * attacks.length)],
                        status: 'Active',
                        time: new Date().toLocaleTimeString().slice(0,5),
                        isRealAttack: Math.random() > 0.3 // 70% chance de ser ataque real
                    };
                    
                    setAlerts(prev => [newAlert, ...prev].slice(0, 8)); // Mantém os 8 mais recentes
                }, 12000); // Gera novo evento a cada 12 segundos
                return () => clearInterval(interval);
            }, []);

            const handleAction = (id, action) => {
                // Atualiza o status de imediato (Ex: 'Investigating' ou 'Blocked')
                setAlerts(prev => prev.map(a => a.id === id ? { ...a, status: action } : a));
                
                if (action === 'Investigating') {
                    // Simula uma demora de 3 segundos para análise
                    setTimeout(() => {
                        setAlerts(prev => prev.map(a => {
                            if (a.id === id) {
                                return { 
                                    ...a, 
                                    status: 'Analyzed', 
                                    analysisResult: a.isRealAttack ? '🚨 Ameaça Confirmada!' : '✅ Falso Positivo' 
                                };
                            }
                            return a;
                        }));
                    }, 3000);
                } else if (action === 'Blocked') {
                    addScore(30); // Ganha pontos ao bloquear com sucesso
                } else if (action === 'Dismissed') {
                    // Apenas ignorado, nada extra
                }
            };

            return (
                <div className="p-4 md:p-8 h-full flex flex-col">
                    <header className="mb-4 flex flex-col md:flex-row md:justify-between md:items-end gap-2">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
                                <i className="fas fa-server text-blue-500"></i> Centro de Operações (SOC)
                            </h2>
                            <p className="text-gray-400 text-xs md:text-sm mt-1">Analise e bloqueie ameaças em tempo real para ganhar XP.</p>
                        </div>
                    </header>

                    <div className="flex-1 bg-gray-900/50 border border-gray-800 rounded-xl overflow-y-auto flex flex-col">
                        <div className="flex-1 p-2">
                            {alerts.map(alert => (
                                <div key={alert.id} className="flex flex-col md:flex-row md:items-center justify-between p-3 mb-2 bg-gray-950 border border-gray-800 rounded-lg">
                                    <div className="flex flex-col md:flex-row md:items-center gap-2 md:gap-4 mb-3 md:mb-0">
                                        <span className={`px-2 py-1 rounded text-[10px] md:text-xs font-bold w-fit ${
                                            alert.type === 'CRITICAL' ? 'bg-red-500/20 text-red-500 border border-red-500/30' :
                                            alert.type === 'HIGH' ? 'bg-orange-500/20 text-orange-500 border border-orange-500/30' :
                                            'bg-yellow-500/20 text-yellow-500 border border-yellow-500/30'
                                        }`}>
                                            {alert.type}
                                        </span>
                                        <div className="font-mono text-xs text-blue-400">{alert.source}</div>
                                        <div className="text-sm text-gray-300 font-medium">{alert.desc}</div>
                                    </div>
                                    <div className="flex justify-end gap-2 shrink-0 border-t md:border-t-0 border-gray-800 pt-3 md:pt-0">
                                        {alert.status === 'Active' && (
                                            <button onClick={() => handleAction(alert.id, 'Investigating')} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-bold transition-colors shadow-lg">
                                                <i className="fas fa-search mr-1"></i> Analisar Tráfego
                                            </button>
                                        )}
                                        
                                        {alert.status === 'Investigating' && (
                                            <span className="text-xs font-bold px-3 py-1.5 text-blue-400 flex items-center gap-2">
                                                <i className="fas fa-spinner fa-spin"></i> Analisando...
                                            </span>
                                        )}

                                        {alert.status === 'Analyzed' && (
                                            <div className="flex items-center gap-3">
                                                <span className={`text-xs font-bold ${alert.isRealAttack ? 'text-red-400' : 'text-green-400'}`}>
                                                    {alert.analysisResult}
                                                </span>
                                                {alert.isRealAttack ? (
                                                    <button onClick={() => handleAction(alert.id, 'Blocked')} className="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded text-xs font-bold shadow-lg">
                                                        Bloquear IP (+30 XP)
                                                    </button>
                                                ) : (
                                                    <button onClick={() => handleAction(alert.id, 'Dismissed')} className="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-white rounded text-xs font-bold">
                                                        Ignorar
                                                    </button>
                                                )}
                                            </div>
                                        )}

                                        {alert.status === 'Blocked' && (
                                            <span className="text-xs font-bold px-3 py-1.5 text-green-500 border border-green-500/30 bg-green-500/10 rounded">
                                                <i className="fas fa-check-circle mr-1"></i> AMEAÇA BLOQUEADA
                                            </span>
                                        )}
                                        {alert.status === 'Dismissed' && (
                                            <span className="text-xs font-bold px-3 py-1.5 text-gray-500">
                                                IGNORADO
                                            </span>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- MISSIONS ---
        function MissionsList({ startMission, completedMissions, activeMission }) {
            return (
                <div className="p-4 md:p-8 h-full overflow-y-auto">
                    <header className="mb-6">
                        <h2 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
                            <i className="fas fa-bullseye text-red-500"></i> Operações OWASP Top 10
                        </h2>
                    </header>
                    <div className="grid gap-4">
                        {MISSIONS.map(mission => {
                            const isCompleted = completedMissions.includes(mission.id);
                            const isActive = activeMission?.id === mission.id;
                            
                            return (
                                <div key={mission.id} className={`border rounded-xl p-4 md:p-5 transition-colors ${
                                    isCompleted ? 'bg-green-900/10 border-green-900/50' : 
                                    isActive ? 'bg-yellow-900/10 border-yellow-500/50' : 
                                    'bg-gray-900/50 border-gray-800 hover:border-gray-600'
                                }`}>
                                    <div className="flex flex-col md:flex-row justify-between items-start mb-3 gap-3">
                                        <div>
                                            <h3 className={`text-lg font-bold ${isCompleted ? 'text-green-400' : 'text-gray-200'}`}>
                                                {mission.title} {isCompleted && <i className="fas fa-check-circle ml-1"></i>}
                                            </h3>
                                            <div className="flex flex-wrap items-center gap-2 mt-2">
                                                <span className={`text-[10px] md:text-xs px-2 py-0.5 rounded border ${
                                                    mission.type === 'Offensive' ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-blue-500/10 border-blue-500/30 text-blue-400'
                                                }`}>
                                                    {mission.type === 'Offensive' ? 'Ataque (Red)' : 'Defesa (Blue)'}
                                                </span>
                                                <span className="text-[10px] md:text-xs text-gray-500 bg-gray-800 px-2 py-0.5 rounded">{mission.owasp}</span>
                                                <span className="text-[10px] md:text-xs font-mono text-yellow-500">{mission.points} XP</span>
                                            </div>
                                        </div>
                                        
                                        {!isCompleted && !isActive && (
                                            <button 
                                                onClick={() => startMission(mission)}
                                                className="w-full md:w-auto bg-gray-800 hover:bg-green-600 hover:text-white text-gray-300 px-4 py-2 rounded-lg text-sm transition-colors border border-gray-700 font-bold"
                                            >
                                                Iniciar Missão
                                            </button>
                                        )}
                                        {isActive && (
                                            <button disabled className="w-full md:w-auto bg-yellow-600/20 border border-yellow-600/50 text-yellow-500 px-4 py-2 rounded-lg text-sm font-bold">
                                                Em Progresso no Terminal...
                                            </button>
                                        )}
                                        {isCompleted && (
                                            <button disabled className="w-full md:w-auto bg-green-900/30 text-green-500 px-4 py-2 rounded-lg text-sm font-bold">
                                                Concluída
                                            </button>
                                        )}
                                    </div>
                                    <p className="text-xs md:text-sm text-gray-400 mt-2">{mission.desc}</p>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // --- AI ASSISTANT ---
        function AIAssistant() {
            const [messages, setMessages] = useState([
                { role: 'ai', text: 'Olá Operador. Sou o Nexus. Como posso ajudar nas suas operações de segurança hoje?' }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const endRef = useRef(null);

            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, loading]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;

                const userText = input.trim();
                setInput('');
                setMessages(prev => [...prev, { role: 'user', text: userText }]);
                setLoading(true);

                const aiResponse = await callGeminiAPI(userText);
                setMessages(prev => [...prev, { role: 'ai', text: aiResponse }]);
                setLoading(false);
            };

            return (
                <div className="p-4 md:p-8 h-full flex flex-col max-w-4xl mx-auto w-full">
                    <header className="mb-4 text-center shrink-0">
                        <div className="w-12 h-12 md:w-16 md:h-16 mx-auto bg-purple-900/30 border border-purple-500/50 rounded-full flex items-center justify-center mb-2">
                            <i className="fas fa-robot text-xl md:text-2xl text-purple-400"></i>
                        </div>
                        <h2 className="text-lg md:text-2xl font-bold text-white">Nexus AI</h2>
                    </header>

                    <div className="flex-1 bg-gray-900/50 border border-gray-800 rounded-xl p-3 md:p-4 overflow-y-auto flex flex-col gap-4">
                        {messages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-2xl p-3 text-xs md:text-sm ${
                                    msg.role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-800 text-gray-200 rounded-bl-none border border-gray-700'
                                }`}>
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        {loading && (
                            <div className="flex justify-start">
                                <div className="bg-gray-800 text-gray-400 rounded-2xl rounded-bl-none border border-gray-700 p-3 flex gap-2">
                                    <div className="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></div>
                                    <div className="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></div>
                                </div>
                            </div>
                        )}
                        <div ref={endRef} />
                    </div>

                    <form onSubmit={handleSubmit} className="mt-3 relative shrink-0">
                        <input 
                            type="text" 
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            placeholder="Pergunte algo..."
                            className="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 pl-4 pr-12 text-sm text-gray-200 focus:outline-none focus:border-purple-500"
                        />
                        <button type="submit" disabled={loading || !input.trim()} className="absolute right-2 top-1.5 bottom-1.5 w-10 flex items-center justify-center bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white rounded-lg">
                            <i className="fas fa-paper-plane text-sm"></i>
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CyberSecApp />);
    </script>
</body>
</html>
