```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Academy - Simulador</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Para converter JSX no navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Estilos base */
        body { margin: 0; padding: 0; background-color: #030712; color: #d1d5db; }
        /* Esconder scrollbar na navegação mobile */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SERVIÇO DE IA (GEMINI API) ---
        const apiKey = ""; // Insira sua chave da API do Google Gemini aqui

        const callGeminiAPI = async (promptText) => {
            if (!apiKey) return "Modo offline simulado. A chave da API não está configurada no código.";
            
            try {
                const payload = {
                    contents: [{ parts: [{ text: promptText }] }],
                    systemInstruction: { 
                        parts: [{ 
                            text: "Você é o 'Nexus', um assistente avançado de IA especializado em cibersegurança (Pentest e SOC) dentro de uma plataforma gamificada. Dê respostas concisas, técnicas e didáticas. Explique vulnerabilidades do OWASP Top 10, sugira comandos de terminal (Nmap, SQLmap, mitigação de firewall) e ajude o analista a subir de nível. Fale em português." 
                        }] 
                    }
                };
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Conexão com o mainframe de IA falhou.";
            } catch (e) {
                console.error("Erro na API Gemini:", e);
                return "Erro ao contatar o Nexus AI. Verifique o console.";
            }
        };

        // --- DADOS MOCKADOS ---
        const MISSIONS = [
            { id: 1, title: "Injeção de SQL (SQLi)", type: "Offensive", diff: "Iniciante", owasp: "A03:2021", points: 100, desc: "Explore o painel de login de um banco desatualizado para extrair a tabela de usuários." },
            { id: 2, title: "Broken Authentication", type: "Offensive", diff: "Iniciante", owasp: "A07:2021", points: 100, desc: "Execute um ataque de força bruta usando senhas vazadas em um portal administrativo." },
            { id: 3, title: "Mitigação de DDoS e WAF", type: "Defensive", diff: "Intermediário", owasp: "A05:2021", points: 150, desc: "Configure regras no Web Application Firewall para bloquear tráfego malicioso." },
            { id: 4, title: "Cross-Site Scripting (XSS)", type: "Offensive", diff: "Intermediário", owasp: "A03:2021", points: 150, desc: "Vazar cookies de sessão explorando um campo de comentários não sanitizado." }
        ];

        // --- COMPONENTE PRINCIPAL ---
        function CyberSecApp() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [playerInfo, setPlayerInfo] = useState({ score: 0, level: 1, rank: 'Script Kiddie' });
            
            useEffect(() => {
                const newLevel = Math.floor(playerInfo.score / 200) + 1;
                let newRank = 'Script Kiddie';
                if (newLevel >= 3) newRank = 'Junior Pentester';
                if (newLevel >= 5) newRank = 'SOC Analyst L1';
                if (newLevel >= 10) newRank = 'Cyber Expert';
                
                if (newLevel !== playerInfo.level || newRank !== playerInfo.rank) {
                    setPlayerInfo(prev => ({ ...prev, level: newLevel, rank: newRank }));
                }
            }, [playerInfo.score]);

            const addScore = (points) => {
                setPlayerInfo(prev => ({ ...prev, score: prev.score + points }));
            };

            return (
                <div className="flex flex-col md:flex-row h-screen bg-gray-950 text-gray-300 font-mono overflow-hidden">
                    {/* SIDEBAR RESPONSIVA */}
                    <aside className="w-full md:w-64 bg-gray-900 border-b md:border-b-0 md:border-r border-green-900/30 flex flex-col shrink-0">
                        <div className="p-4 border-b border-green-900/30 hidden md:block">
                            <h1 className="text-xl font-bold text-green-500 flex items-center gap-2">
                                <i className="fas fa-shield-alt w-5"></i> CyberSec UI
                            </h1>
                        </div>
                        
                        {/* Navegação - Scroll horizontal no mobile */}
                        <nav className="flex md:flex-col overflow-x-auto no-scrollbar p-2 md:p-4 gap-2 flex-1 items-center md:items-stretch">
                            <NavButton icon="fa-columns" label="Dashboard" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                            <NavButton icon="fa-terminal" label="Terminal" active={activeTab === 'terminal'} onClick={() => setActiveTab('terminal')} />
                            <NavButton icon="fa-chart-line" label="SOC" active={activeTab === 'soc'} onClick={() => setActiveTab('soc')} />
                            <NavButton icon="fa-bullseye" label="Missões" active={activeTab === 'missions'} onClick={() => setActiveTab('missions')} />
                            <NavButton icon="fa-robot" label="Nexus AI" active={activeTab === 'ai'} onClick={() => setActiveTab('ai')} />
                        </nav>

                        {/* Perfil (Escondido no mobile para poupar espaço) */}
                        <div className="p-4 bg-gray-900 border-t border-green-900/30 hidden md:block">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-green-900/50 flex items-center justify-center border border-green-500/50 text-green-400 font-bold">
                                    L{playerInfo.level}
                                </div>
                                <div>
                                    <p className="text-sm font-semibold text-gray-200">Operador Z3R0</p>
                                    <p className="text-xs text-green-400">{playerInfo.rank}</p>
                                    <p className="text-xs text-yellow-500 mt-1">{playerInfo.score} XP</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 flex flex-col h-[calc(100vh-60px)] md:h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-gray-950 to-black overflow-hidden">
                        {activeTab === 'dashboard' && <Dashboard playerInfo={playerInfo} />}
                        {activeTab === 'terminal' && <TerminalInterface addScore={addScore} />}
                        {activeTab === 'soc' && <SOCPanel addScore={addScore} />}
                        {activeTab === 'missions' && <MissionsList />}
                        {activeTab === 'ai' && <AIAssistant />}
                    </main>
                </div>
            );
        }

        // --- SUB-COMPONENTES ---

        function NavButton({ icon, label, active, onClick }) {
            return (
                <button 
                    onClick={onClick}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-left transition-all duration-200 whitespace-nowrap shrink-0 md:w-full ${
                        active 
                            ? 'bg-green-500/10 text-green-400 border border-green-500/30' 
                            : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'
                    }`}
                >
                    <i className={`fas ${icon} w-5 text-center`}></i>
                    <span className="font-medium text-sm hidden md:inline">{label}</span>
                    <span className="font-medium text-xs md:hidden">{label}</span>
                </button>
            );
        }

        function Dashboard({ playerInfo }) {
            return (
                <div className="p-4 md:p-8 overflow-y-auto h-full">
                    <header className="mb-6 md:mb-8">
                        <h2 className="text-xl md:text-2xl font-bold text-white">Quartel General</h2>
                        <p className="text-gray-400 text-xs md:text-sm mt-1">Visão geral do seu treinamento (Mobile-friendly).</p>
                    </header>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mb-8">
                        <StatCard icon="fa-award" title="Nível Atual" value={playerInfo.level} subtitle={playerInfo.rank} color="text-yellow-400" />
                        <StatCard icon="fa-bolt" title="Experiência (XP)" value={playerInfo.score} subtitle="Pontos totais acumulados" color="text-green-400" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 md:p-6 relative overflow-hidden group">
                            <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                <i className="fas fa-microchip text-6xl text-green-500"></i>
                            </div>
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <i className="fas fa-bullseye text-sm"></i> Próximo Objetivo
                            </h3>
                            <p className="text-sm text-gray-300 mb-4 z-10 relative">Sua primeira missão está aguardando. Navegue até o Terminal e execute seu primeiro scan.</p>
                            <div className="bg-black/50 p-4 rounded-lg font-mono text-sm text-green-400 border border-green-900/30 overflow-x-auto">
                                $ nmap -sV target.local
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ icon, title, value, subtitle, color }) {
            return (
                <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 md:p-6 flex items-start gap-4">
                    <div className={`p-3 rounded-lg bg-gray-950 border border-gray-800 flex items-center justify-center w-12 h-12 ${color}`}>
                        <i className={`fas ${icon} text-xl`}></i>
                    </div>
                    <div>
                        <h4 className="text-gray-400 text-xs md:text-sm font-medium">{title}</h4>
                        <div className="text-xl md:text-2xl font-bold text-white mt-1">{value}</div>
                        <div className="text-xs text-gray-500 mt-1">{subtitle}</div>
                    </div>
                </div>
            );
        }

        // --- TERMINAL SIMULATOR ---
        function TerminalInterface({ addScore }) {
            const [history, setHistory] = useState([
                { type: 'system', content: 'Iniciando Kernel Hacking OS v1.0.4...' },
                { type: 'system', content: 'Conexão segura estabelecida.' },
                { type: 'info', content: 'Digite "help" para comandos disponíveis.' },
            ]);
            const [input, setInput] = useState('');
            const endRef = useRef(null);

            useEffect(() => {
                endRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [history]);

            const handleCommand = async (e) => {
                e.preventDefault();
                if (!input.trim()) return;

                const cmd = input.trim();
                const args = cmd.split(' ');
                const baseCmd = args[0].toLowerCase();

                setHistory(prev => [...prev, { type: 'input', content: `$ ${cmd}` }]);
                setInput('');

                let response = [];
                switch(baseCmd) {
                    case 'help':
                        response = [
                            { type: 'info', content: 'Comandos:' },
                            { type: 'info', content: '  clear    - Limpa o terminal' },
                            { type: 'info', content: '  scan     - Varredura (ex: scan target.local)' },
                            { type: 'info', content: '  exploit  - Atacar (ex: exploit sqli)' },
                            { type: 'info', content: '  mitigate - Corrigir (ex: mitigate sqli)' },
                            { type: 'info', content: '  ask_ai   - Ajuda IA (ex: ask_ai o que é nmap)' },
                        ];
                        break;
                    case 'clear':
                        setHistory([]); return;
                    case 'scan':
                        const target = args[1] || 'unknown';
                        if (target === 'target.local') {
                            response = [
                                { type: 'system', content: `Iniciando Nmap 7.93 em ${target}...` },
                                { type: 'info', content: 'Porta 80/tcp aberta (http)' },
                                { type: 'warning', content: '[!] Possível SQLi no /login' },
                            ];
                            addScore(10);
                        } else {
                            response = [{ type: 'error', content: `Alvo '${target}' inalcançável.` }];
                        }
                        break;
                    case 'exploit':
                        if (args[1] === 'sqli') {
                            response = [
                                { type: 'warning', content: 'Injetando payload...' },
                                { type: 'success', content: 'Acesso Admin Concedido! (+50 XP)' },
                            ];
                            addScore(50);
                        } else {
                            response = [{ type: 'error', content: 'Uso: exploit sqli' }];
                        }
                        break;
                    case 'mitigate':
                        if (args[1] === 'sqli') {
                            response = [
                                { type: 'system', content: 'Aplicando Prepared Statements...' },
                                { type: 'success', content: 'Vulnerabilidade corrigida! (+50 XP)' },
                            ];
                            addScore(50);
                        } else {
                            response = [{ type: 'error', content: 'Uso: mitigate sqli' }];
                        }
                        break;
                    case 'ask_ai':
                        const question = args.slice(1).join(' ');
                        if (!question) {
                            response = [{ type: 'error', content: 'Faça uma pergunta.' }];
                        } else {
                            setHistory(prev => [...prev, { type: 'system', content: 'Analisando...' }]);
                            const aiReply = await callGeminiAPI(question);
                            setHistory(prev => [...prev, { type: 'ai', content: `Nexus: ${aiReply}` }]);
                            return; 
                        }
                        break;
                    default:
                        response = [{ type: 'error', content: `Comando não encontrado: ${baseCmd}` }];
                }
                setHistory(prev => [...prev, ...response]);
            };

            return (
                <div className="h-full flex flex-col p-2 md:p-6 font-mono text-xs md:text-sm">
                    <div className="flex-1 bg-black/80 border border-gray-800 rounded-t-xl p-3 overflow-y-auto shadow-2xl">
                        {history.map((line, i) => (
                            <div key={i} className={`mb-1.5 break-words ${
                                line.type === 'input' ? 'text-gray-300' :
                                line.type === 'error' ? 'text-red-400' :
                                line.type === 'success' ? 'text-green-400' :
                                line.type === 'warning' ? 'text-yellow-400' :
                                line.type === 'ai' ? 'text-purple-400 border-l-2 border-purple-500 pl-2 my-2' :
                                'text-blue-400'
                            }`}>
                                {line.content}
                            </div>
                        ))}
                        <div ref={endRef} />
                    </div>
                    <form onSubmit={handleCommand} className="bg-gray-950 border border-t-0 border-gray-800 rounded-b-xl flex items-center p-2">
                        <span className="text-green-500 ml-1 md:ml-2 mr-2 font-bold whitespace-nowrap">root@cyber:~$</span>
                        <input 
                            type="text" 
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            className="flex-1 bg-transparent text-gray-200 outline-none w-full"
                            autoComplete="off"
                            spellCheck="false"
                        />
                    </form>
                </div>
            );
        }

        // --- SOC DASHBOARD ---
        function SOCPanel({ addScore }) {
            const [alerts, setAlerts] = useState([
                { id: 1, type: 'CRITICAL', source: '192.168.1.105', desc: 'Tentativa de Força Bruta', status: 'Active', time: 'Agora' }
            ]);

            useEffect(() => {
                const interval = setInterval(() => {
                    const types = ['HIGH', 'MEDIUM', 'CRITICAL'];
                    const attacks = ['Tentativa SQLi', 'Scanner Nmap', 'Tráfego Anômalo', 'Upload Malicioso'];
                    
                    const newAlert = {
                        id: Date.now(),
                        type: types[Math.floor(Math.random() * types.length)],
                        source: `10.0.0.${Math.floor(Math.random() * 255)}`,
                        desc: attacks[Math.floor(Math.random() * attacks.length)],
                        status: 'Active',
                        time: new Date().toLocaleTimeString().slice(0,5)
                    };
                    
                    setAlerts(prev => [newAlert, ...prev].slice(0, 6));
                }, 15000);
                return () => clearInterval(interval);
            }, []);

            const handleAction = (id, action) => {
                setAlerts(prev => prev.map(a => a.id === id ? { ...a, status: action } : a));
                if (action === 'Blocked') addScore(20);
            };

            return (
                <div className="p-4 md:p-8 h-full flex flex-col">
                    <header className="mb-4 flex flex-col md:flex-row md:justify-between md:items-end gap-2">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
                                <i className="fas fa-server text-blue-500"></i> SOC L1
                            </h2>
                        </div>
                        <div className="flex items-center gap-2 text-green-400 text-xs font-bold bg-green-400/10 px-3 py-1 rounded-full border border-green-500/30 w-fit">
                            <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> REDE SEGURA
                        </div>
                    </header>

                    <div className="flex-1 bg-gray-900/50 border border-gray-800 rounded-xl overflow-y-auto flex flex-col">
                        <div className="flex-1 p-2">
                            {alerts.map(alert => (
                                <div key={alert.id} className="flex flex-col md:flex-row md:items-center justify-between p-3 mb-2 bg-gray-900 border border-gray-800 rounded-lg">
                                    <div className="flex flex-col md:flex-row md:items-center gap-2 md:gap-4 mb-2 md:mb-0">
                                        <span className={`px-2 py-1 rounded text-[10px] md:text-xs font-bold w-fit ${
                                            alert.type === 'CRITICAL' ? 'bg-red-500/20 text-red-500' :
                                            alert.type === 'HIGH' ? 'bg-orange-500/20 text-orange-500' :
                                            'bg-yellow-500/20 text-yellow-500'
                                        }`}>
                                            {alert.type}
                                        </span>
                                        <div className="font-mono text-xs text-gray-300">{alert.source}</div>
                                        <div className="text-sm text-gray-400">{alert.desc}</div>
                                    </div>
                                    <div className="flex justify-end gap-2 shrink-0">
                                        {alert.status === 'Active' ? (
                                            <>
                                                <button onClick={() => handleAction(alert.id, 'Blocked')} className="px-3 py-1 bg-red-500/10 text-red-400 border border-red-500/30 rounded text-xs">Bloquear</button>
                                                <button onClick={() => handleAction(alert.id, 'Investigating')} className="px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/30 rounded text-xs">Analisar</button>
                                            </>
                                        ) : (
                                            <span className={`text-xs font-bold px-3 py-1 rounded ${alert.status === 'Blocked' ? 'text-green-500' : 'text-blue-500'}`}>
                                                {alert.status === 'Blocked' ? 'BLOQUEADO' : 'ANALISANDO'}
                                            </span>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- MISSIONS ---
        function MissionsList() {
            return (
                <div className="p-4 md:p-8 h-full overflow-y-auto">
                    <header className="mb-6">
                        <h2 className="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
                            <i className="fas fa-bullseye text-red-500"></i> Missões (OWASP)
                        </h2>
                    </header>
                    <div className="grid gap-4">
                        {MISSIONS.map(mission => (
                            <div key={mission.id} className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 md:p-5">
                                <div className="flex flex-col md:flex-row justify-between items-start mb-3 gap-3">
                                    <div>
                                        <h3 className="text-lg font-bold text-gray-200">{mission.title}</h3>
                                        <div className="flex flex-wrap items-center gap-2 mt-2">
                                            <span className={`text-[10px] md:text-xs px-2 py-0.5 rounded border ${
                                                mission.type === 'Offensive' ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-blue-500/10 border-blue-500/30 text-blue-400'
                                            }`}>
                                                {mission.type === 'Offensive' ? 'Ataque' : 'Defesa'}
                                            </span>
                                            <span className="text-[10px] md:text-xs text-gray-500 bg-gray-800 px-2 py-0.5 rounded">{mission.owasp}</span>
                                            <span className="text-[10px] md:text-xs font-mono text-yellow-500">{mission.points} XP</span>
                                        </div>
                                    </div>
                                    <button className="w-full md:w-auto bg-gray-800 hover:bg-green-600 hover:text-white text-gray-300 px-4 py-2 rounded-lg text-sm transition-colors border border-gray-700">
                                        Iniciar
                                    </button>
                                </div>
                                <p className="text-xs md:text-sm text-gray-400 mt-2">{mission.desc}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- AI ASSISTANT ---
        function AIAssistant() {
            const [messages, setMessages] = useState([
                { role: 'ai', text: 'Olá Operador. Sou o Nexus. Como posso ajudar nas suas operações de segurança hoje?' }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const endRef = useRef(null);

            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, loading]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;

                const userText = input.trim();
                setInput('');
                setMessages(prev => [...prev, { role: 'user', text: userText }]);
                setLoading(true);

                const aiResponse = await callGeminiAPI(userText);
                setMessages(prev => [...prev, { role: 'ai', text: aiResponse }]);
                setLoading(false);
            };

            return (
                <div className="p-4 md:p-8 h-full flex flex-col max-w-4xl mx-auto w-full">
                    <header className="mb-4 text-center">
                        <div className="w-12 h-12 md:w-16 md:h-16 mx-auto bg-purple-900/30 border border-purple-500/50 rounded-full flex items-center justify-center mb-2">
                            <i className="fas fa-robot text-xl md:text-2xl text-purple-400"></i>
                        </div>
                        <h2 className="text-lg md:text-2xl font-bold text-white">Nexus AI</h2>
                    </header>

                    <div className="flex-1 bg-gray-900/50 border border-gray-800 rounded-xl p-3 md:p-4 overflow-y-auto flex flex-col gap-4">
                        {messages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-2xl p-3 text-xs md:text-sm ${
                                    msg.role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-800 text-gray-200 rounded-bl-none border border-gray-700'
                                }`}>
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        {loading && (
                            <div className="flex justify-start">
                                <div className="bg-gray-800 text-gray-400 rounded-2xl rounded-bl-none border border-gray-700 p-3 flex gap-2">
                                    <div className="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></div>
                                    <div className="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></div>
                                </div>
                            </div>
                        )}
                        <div ref={endRef} />
                    </div>

                    <form onSubmit={handleSubmit} className="mt-3 relative">
                        <input 
                            type="text" 
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            placeholder="Pergunte algo..."
                            className="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 pl-4 pr-12 text-sm text-gray-200 focus:outline-none focus:border-purple-500"
                        />
                        <button type="submit" disabled={loading || !input.trim()} className="absolute right-2 top-1.5 bottom-1.5 w-10 flex items-center justify-center bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white rounded-lg">
                            <i className="fas fa-paper-plane text-sm"></i>
                        </button>
                    </form>
                </div>
            );
        }

        // Renderiza o App React na div #root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CyberSecApp />);
    </script>
